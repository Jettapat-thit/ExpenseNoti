# Render Blueprint — deploy ด้วยการเชื่อม GitHub repo แล้ว Render จะอ่านไฟล์นี้เอง
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: expensenoti
    runtime: python
    plan: starter            # $7/เดือน — จำเป็นเพราะต้องใช้ persistent disk
    buildCommand: pip install -r requirements.txt
    # ใช้ worker เดียว เพื่อไม่ให้ scheduler รันซ้ำหลาย process
    startCommand: gunicorn app:app --workers 1 --bind 0.0.0.0:$PORT --timeout 120
    disk:
      name: data
      mountPath: /data       # ไฟล์ SQLite เก็บที่นี่ ไม่หายเวลา redeploy
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /data/expenses.db
      - key: RUN_SCHEDULER     # เปิด background scheduler ในตัวเว็บ
        value: "1"
      - key: NOTIFY_MINUTE     # นาทีที่เช็คทุกชั่วโมง (ส่งตามเวลาที่แต่ละ user ตั้ง)
        value: "0"
      - key: TIMEZONE
        value: Asia/Bangkok
      - key: BASE_URL          # URL จริงของแอป (ใช้ทำ redirect URI ของ LINE Login)
        value: https://expensenoti.onrender.com
      - key: SECRET_KEY
        generateValue: true
      # ใส่ค่าจริงเหล่านี้ในหน้า Dashboard ของ Render (อย่า commit ลง repo)
      - key: LINE_CHANNEL_ACCESS_TOKEN   # จาก Messaging API channel
        sync: false
      - key: LINE_LOGIN_CHANNEL_ID       # จาก LINE Login channel
        sync: false
      - key: LINE_LOGIN_CHANNEL_SECRET
        sync: false
