# Render Blueprint — deploy ด้วยการเชื่อม GitHub repo แล้ว Render จะอ่านไฟล์นี้เอง
# https://render.com/docs/blueprint-spec
# ใช้ PostgreSQL (managed) เป็นฐานข้อมูล — ต่อ DBeaver จากภายนอกได้
databases:
  - name: spendly-db
    plan: free            # ฟรี 1 GB (มีอายุ ~90 วันสำหรับแพ็กฟรี / อัปเป็น Basic เพื่อใช้ถาวร)
    databaseName: spendly
    user: spendly

services:
  - type: web
    name: expensenoti
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    # worker เดียว เพื่อไม่ให้ scheduler รันซ้ำหลาย process
    startCommand: gunicorn app:app --workers 1 --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: DATABASE_URL            # ดึง connection string จาก managed Postgres อัตโนมัติ
        fromDatabase:
          name: spendly-db
          property: connectionString
      - key: RUN_SCHEDULER
        value: "1"
      - key: NOTIFY_MINUTE
        value: "0"
      - key: TIMEZONE
        value: Asia/Bangkok
      - key: BASE_URL                # URL จริงของแอป (ใช้ทำ redirect URI ของ LINE Login)
        value: https://expensenoti.onrender.com
      - key: SECRET_KEY
        generateValue: true
      # ใส่ค่าจริงเหล่านี้ในหน้า Dashboard ของ Render (อย่า commit ลง repo)
      - key: LINE_CHANNEL_ACCESS_TOKEN   # จาก Messaging API channel
        sync: false
      - key: LINE_LOGIN_CHANNEL_ID       # จาก LINE Login channel
        sync: false
      - key: LINE_LOGIN_CHANNEL_SECRET
        sync: false
