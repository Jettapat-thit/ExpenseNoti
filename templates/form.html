{% extends "base.html" %}
{% block content %}

<h2>{{ "แก้ไขรายการ" if expense else "เพิ่มรายการ" }}</h2>

<form method="post" class="card form" id="expform">
    <label>
        ชื่อรายการ *
        <input type="text" name="name" required placeholder="เช่น ค่าไฟบ้าน, ผ่อนรถ, บัตรเครดิต KTC"
               value="{{ expense.name if expense else '' }}">
    </label>

    <div class="row">
        <label>
            ประเภท
            <select name="type" id="type-select">
                <option value="expense" {% if not expense or expense.type != 'income' %}selected{% endif %}>รายจ่าย</option>
                <option value="income" {% if expense and expense.type == 'income' %}selected{% endif %}>รายรับ</option>
            </select>
        </label>
        <label>
            หมวดหมู่
            <select name="category" id="cat-select">
                {% for c in categories %}
                <option value="{{ c.key }}" data-type="{{ c.type }}"
                    {% if expense and expense.category == c.key %}selected{% endif %}>
                    {{ c.icon }} {{ c.label }}
                </option>
                {% endfor %}
            </select>
        </label>
    </div>

    <label class="checkbox" style="margin-bottom:10px">
        <input type="checkbox" name="variable_amount" id="var-check"
               {% if expense and expense.variable_amount %}checked{% endif %}>
        ยอดไม่กำหนดล่วงหน้า (เช่น บัตรเครดิต) — เตือนตามกำหนด แล้วกรอกยอดจริงตอนจ่าย
    </label>

    <label class="checkbox" style="margin-bottom:10px">
        <input type="checkbox" name="tracking_only"
               {% if expense and expense.tracking_only %}checked{% endif %}>
        ไม่นำมารวมในยอดรวม (มีไว้ติดตามเฉย ๆ) — ยังเตือนและแสดงตามปกติ แต่ไม่คิดในยอด/งบ
    </label>

    {% if pay_methods %}
    <label id="via-label">
        จ่ายผ่านรายการอื่น (ไม่นำมารวมยอด)
        <select name="paid_via">
            <option value="">— ไม่ได้จ่ายผ่านรายการอื่น —</option>
            {% for m in pay_methods %}
            <option value="{{ m.id }}" {% if expense and expense.paid_via == m.id %}selected{% endif %}>{{ m.name }}</option>
            {% endfor %}
        </select>
        <small class="muted">เช่น ผ่อน iPad รวมอยู่ในบิลบัตรเครดิต KTC แล้ว — เลือกบัตร KTC เพื่อไม่ให้นับยอดซ้ำ</small>
    </label>
    {% endif %}

    <div class="row">
        <label id="amount-label">
            ยอดต่อเดือน (บาท)
            <input type="number" name="amount" step="0.01" min="0"
                   value="{{ expense.amount if expense else '' }}">
        </label>
        <label>
            ครบกำหนด / วันรับเงิน (วันของเดือน 1–31) *
            <input type="number" name="due_day" min="1" max="31" required
                   value="{{ expense.due_day if expense else 1 }}">
        </label>
        <label>
            เตือนล่วงหน้า (วัน)
            <input type="number" name="remind_days_before" min="0" max="31"
                   value="{{ expense.remind_days_before if expense else default_remind }}">
        </label>
    </div>

    <fieldset class="installment-box" id="inst-box">
        <legend>สำหรับการผ่อน (เว้นว่างถ้าเป็นรายเดือนไม่จำกัด)</legend>
        <div class="row">
            <label>
                จำนวนงวดทั้งหมด
                <input type="number" name="total_installments" min="1" placeholder="เช่น 48"
                       value="{{ expense.total_installments if expense and expense.total_installments else '' }}">
            </label>
            <label>
                จ่ายไปแล้ว (งวด)
                <input type="number" name="paid_installments" min="0"
                       value="{{ expense.paid_installments if expense else 0 }}">
            </label>
            <label>
                วันเริ่มผ่อน
                <input type="date" name="start_date"
                       value="{{ expense.start_date if expense and expense.start_date else '' }}">
            </label>
        </div>
    </fieldset>

    <label>
        หมายเหตุ
        <input type="text" name="note" placeholder="ข้อมูลเพิ่มเติม (ไม่บังคับ)"
               value="{{ expense.note if expense and expense.note else '' }}">
    </label>

    <label class="checkbox">
        <input type="checkbox" name="active" {% if not expense or expense.active %}checked{% endif %}>
        เปิดใช้งานการแจ้งเตือน
    </label>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">บันทึก</button>
        <a href="{{ url_for('index') }}" class="btn">ยกเลิก</a>
    </div>
</form>

<script>
(function(){
    var typeSel = document.getElementById('type-select');
    var catSel  = document.getElementById('cat-select');
    var varChk  = document.getElementById('var-check');
    var instBox = document.getElementById('inst-box');
    var amtLabel= document.getElementById('amount-label');
    var amtInput= amtLabel.querySelector('input');

    function syncCats(){
        var t = typeSel.value;
        var firstVisible = null;
        Array.prototype.forEach.call(catSel.options, function(o){
            var show = o.getAttribute('data-type') === t;
            o.hidden = !show;
            o.disabled = !show;
            if(show && firstVisible === null) firstVisible = o;
        });
        if(catSel.selectedOptions.length === 0 || catSel.selectedOptions[0].hidden){
            if(firstVisible) firstVisible.selected = true;
        }
        // รายรับซ่อนช่องผ่อน
        instBox.style.display = (t === 'income') ? 'none' : '';
    }
    function syncVar(){
        // ยอดแปรผัน -> ไม่ต้องกรอกยอด
        amtInput.disabled = varChk.checked;
        amtLabel.style.opacity = varChk.checked ? .45 : 1;
        if(varChk.checked) amtInput.value = '';
    }
    typeSel.addEventListener('change', syncCats);
    varChk.addEventListener('change', syncVar);
    syncCats(); syncVar();
})();
</script>

{% endblock %}
