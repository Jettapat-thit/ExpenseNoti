{% extends "base.html" %}
{% block content %}

<h2>บันทึกการจ่าย — {{ expense.name }}</h2>

<form method="post" class="card form">
    <div class="row">
        <label>
            ยอดที่จ่ายจริง (บาท) *
            <input type="number" name="amount" step="0.01" min="0" required
                   value="{{ expense.amount }}">
        </label>
        <label>
            วันที่จ่าย *
            <input type="date" name="paid_date" required value="{{ today.isoformat() }}">
        </label>
    </div>

    {% if expense.total_installments %}
    <p class="muted">รายการนี้เป็นการผ่อน — บันทึกแล้วจะนับเป็นงวดที่
        <strong>{{ expense.paid_installments + 1 }}/{{ expense.total_installments }}</strong></p>
    {% endif %}

    <label>
        หมายเหตุ
        <input type="text" name="note" placeholder="เช่น เลขมิเตอร์ / ช่องทางที่จ่าย (ไม่บังคับ)">
    </label>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">บันทึกการจ่าย</button>
        <a href="{{ url_for('index') }}" class="btn">ยกเลิก</a>
    </div>
</form>

{% endblock %}
